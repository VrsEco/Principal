[uwsgi]
chdir           = /srv/appgestaoversuscombr.45a4cd4b.configr.cloud/www
pythonpath      = /srv/appgestaoversuscombr.45a4cd4b.configr.cloud/.virtualenv/3.12/lib/python3.12/site-packages
pythonpath      = /srv/appgestaoversuscombr.45a4cd4b.configr.cloud/www/app32

module          = passenger_wsgi:application
env             = 
logto           = /srv/appgestaoversuscombr.45a4cd4b.configr.cloud/log/uwsgi/uwsgi.log
daemonize       = /srv/appgestaoversuscombr.45a4cd4b.configr.cloud/log/uwsgi/uwsgi.log
