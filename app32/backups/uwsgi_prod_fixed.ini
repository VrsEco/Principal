buffer-size     = 12288

## LOAD ENVIROMENT VARIABLES IN .env FILE
for-readline    = /srv/appgestaoversuscombr.45a4cd4b.configr.cloud/www/app32/.env
  env = %(_)
endfor = 

## LOAD ALL OTHERS CONFIGURATION 
for-readline    = /srv/appgestaoversuscombr.45a4cd4b.configr.cloud/etc/uwsgi/conf.d/*.ini
  %(_)
endfor = 
