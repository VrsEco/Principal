        environment_modes: [DEV_FULL, PROD_SAFE]
        actions: [abrir, validar_render]
        owner: QA_AUTOMATION
        scenario: journeys/smoke/test_real_navigation_smoke.py::test_real_navigation_smoke
      - key: integrations.channels
        route: /channels
        environment_modes: [DEV_FULL, PROD_SAFE]
        actions: [abrir, validar_render]
        owner: QA_AUTOMATION
        scenario: journeys/smoke/test_real_navigation_smoke.py::test_real_navigation_smoke
  - name: work_journey
    criticality: alta
    items:
      - key: work_journey.root
        route: /work-journey
        environment_modes: [DEV_FULL, PROD_SAFE]
        actions: [abrir, validar_render]
        owner: QA_AUTOMATION
        scenario: backlog
      - key: work_journey.company_board
        route: /companies/<company_id>/work-journey
        environment_modes: [DEV_FULL, PROD_SAFE]
