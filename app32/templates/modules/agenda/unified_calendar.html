{% extends "layouts/workspace.html" %}

{% block title %}Agenda | Versus{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/unified-calendar.css', v='5') }}">
{% endblock %}

{% block workspace_content %}
<div class="ag" id="agRoot"
     data-company-id="{{ company.id }}"
     data-company-name="{{ company.name }}"
     data-today="{{ today }}"
     data-can-view-all="{{ can_view_all|tojson }}"
     data-employee-id="{{ current_employee_id or '' }}"
     data-legacy-url="/companies/{{ company.id }}/calendar">

    <header class="ag-top">
        <h1 class="ag-title">Agenda</h1>
        <div class="ag-top__right">
            <button type="button" class="ag-chip ag-filter-toggle" id="agFilterToggle" aria-expanded="false" aria-controls="agFilters">Filtros</button>
            <button type="button" class="ag-chip" id="agGoogleChip" hidden></button>
            <button type="button" class="ag-ibtn" id="agMenuBtn" aria-label="Mais opções" aria-haspopup="dialog">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
            </button>
        </div>
    </header>

    <div class="ag-toolbar">
        <div class="ag-nav" role="group" aria-label="Navegação de datas">
            <button type="button" class="ag-btn ag-btn--sm" id="agToday">Hoje</button>
            <button type="button" class="ag-ibtn ag-ibtn--sm" id="agPrev" aria-label="Anterior">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <button type="button" class="ag-ibtn ag-ibtn--sm" id="agNext" aria-label="Próximo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            </button>
            <h2 class="ag-range" id="agRange" aria-live="polite"></h2>
        </div>
        <div class="ag-toolbar__right">
            <button type="button" class="ag-chip ag-blocks-toggle" id="agBlocksToggle" aria-pressed="false">Blocos</button>
            <div class="ag-seg" id="agViews" role="group" aria-label="Visão">
                <button type="button" data-view="day" aria-pressed="false">Dia</button>
                <button type="button" data-view="week" aria-pressed="false">Semana</button>
                <button type="button" data-view="month" aria-pressed="false">Mês</button>
            </div>
            <button type="button" class="ag-btn ag-btn--primary ag-create-desktop" id="agCreateBtn" aria-haspopup="dialog">+ Criar</button>
        </div>
    </div>

    <div class="ag-filters" id="agFilters" role="group" aria-label="Filtros"></div>

    <div class="ag-banner" id="agBanner" role="alert" hidden></div>

    <div class="ag-est" id="agEst" hidden></div>

    <section class="ag-late" id="agLate" aria-label="Atrasadas" hidden></section>

    <main class="ag-main" id="agMain" aria-live="polite" aria-busy="true">
        <p class="ag-state">Carregando a agenda…</p>
    </main>

    <button type="button" class="ag-fab" id="agFab" aria-label="Criar" aria-haspopup="dialog">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Criar
    </button>

    <div id="agLayer"></div>
    <div class="ag-toast" id="agToast" role="status" aria-live="polite" hidden></div>
    <noscript><p class="ag-state">Ative o JavaScript para usar a Agenda.</p></noscript>

    <script type="application/json" id="agBoot">{{ boot|tojson }}</script>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/unified-calendar.js', v='5') }}"></script>
{% endblock %}
