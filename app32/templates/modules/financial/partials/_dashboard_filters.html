<section class="dash-panel dash-panel--sidebar-form">
    <div class="dash-panel__body">
        <form id="dashboard-filter-form" class="dash-filter-form dash-filter-form--sidebar">
            <label>
                <span>Início da análise</span>
                <input type="date" name="period_start" required>
            </label>
            <label>
                <span>Fim da análise</span>
                <input type="date" name="period_end" required>
            </label>
            <div class="dash-actions-inline">
                <button type="submit" class="dash-btn dash-btn--primary">Aplicar filtros</button>
            </div>
        </form>
    </div>
</section>
