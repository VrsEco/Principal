<section class="dash-panel dash-panel--working-capital">
    <div class="dash-panel__header">
        <p class="dash-eyebrow">Capital circulante líquido</p>
        <h2>Liquidez estrutural</h2>
        <p class="dash-muted">Ativo, passivo e folga financeira.</p>
    </div>
    <div class="dash-panel__body dash-stack">
        <div id="working-capital-summary" class="dash-metric-grid"></div>
        <div class="dash-dual-list">
            <article class="dash-list-card">
                <div class="dash-list-card__header">
                    <strong>Ativo circulante</strong>
                    <span id="working-capital-asset-total" class="dash-muted">R$ 0,00</span>
                </div>
                <div id="working-capital-assets" class="dash-list"></div>
            </article>
            <article class="dash-list-card">
                <div class="dash-list-card__header">
                    <strong>Passivo circulante</strong>
                    <span id="working-capital-liability-total" class="dash-muted">R$ 0,00</span>
                </div>
                <div id="working-capital-liabilities" class="dash-list"></div>
            </article>
        </div>
    </div>
</section>
