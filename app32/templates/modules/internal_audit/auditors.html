{% extends "layouts/workspace.html" %}
{% block title %}Auditoria Interna - Auditores{% endblock %}
{% block breadcrumb %}<a href="/">Início</a><span class="sep">/</span><a href="/internal-audit">Auditoria Interna</a><span class="sep">/</span><span class="current">Auditores</span>{% endblock %}
{% block workspace_content %}
<div class="audit-page"><header><p class="eyebrow">Cadastros</p><h1>Auditores</h1></header><section class="panel"><form id="auditor-form" class="form-grid"><select name="user_id" id="user-select" required><option value="">Usuário</option></select><select name="role"><option value="auditor">Auditor</option><option value="auditor_admin">Admin Auditoria</option><option value="viewer_executivo">Viewer Executivo</option></select><button class="btn btn-primary">Cadastrar</button></form><div id="auditors-list" class="list"></div></section></div>
<style>.audit-page{padding:0 2rem 2rem}.eyebrow{color:var(--primary);font-weight:800;text-transform:uppercase;font-size:.72rem}.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1rem}.form-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:.75rem}.form-grid select{border:1px solid var(--border);border-radius:12px;padding:.8rem;background:var(--surface-secondary)}.btn{border:0;border-radius:12px;padding:.8rem 1rem;font-weight:800;cursor:pointer}.btn-primary{background:var(--primary);color:#fff}.list{display:grid;gap:.6rem;margin-top:1rem}.row{border:1px solid var(--border);border-radius:12px;padding:.9rem;background:var(--surface-secondary)}@media(max-width:800px){.form-grid{grid-template-columns:1fr}.audit-page{padding:0 1rem 1.5rem}}</style>
<script>
const users=document.getElementById('user-select'), list=document.getElementById('auditors-list');
async function loadOptions(){const r=await fetch('/api/internal-audit/options');const j=await r.json();users.innerHTML='<option value="">Usuário</option>'+(j.data.users||[]).map(u=>`<option value="${u.user_id}">${u.name||u.email||u.user_id}</option>`).join('')}
async function load(){const r=await fetch('/api/internal-audit/auditors');const j=await r.json();list.innerHTML=(j.data||[]).map(a=>`<div class="row"><strong>${a.employee_name||a.user_name||('Usuário '+a.user_id)}</strong><span>${a.role}</span></div>`).join('')||'<div class="row">Nenhum auditor cadastrado.</div>'}
document.getElementById('auditor-form').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/internal-audit/auditors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!j.success){alert(j.message||'Erro');return}e.target.reset();load()});loadOptions();load();
</script>
{% endblock %}
