{% extends "layouts/workspace.html" %}
{% block title %}Auditoria Interna - Execução{% endblock %}
{% block breadcrumb %}<a href="/">Início</a><span class="sep">/</span><a href="/internal-audit">Auditoria Interna</a><span class="sep">/</span><a href="/internal-audit/executions">Execuções</a><span class="sep">/</span><span class="current">Execução</span>{% endblock %}
{% block workspace_content %}
<div class="audit-page" data-execution-id="{{ execution_id }}">
  <header><p class="eyebrow">Onda 2</p><h1 id="execution-title">Execução de Auditoria</h1><p class="subtitle" id="execution-meta">Carregando...</p></header>
  <section id="items-list" class="cards"></section>
</div>
<style>
.audit-page{padding:0 2rem 2rem}.eyebrow{color:var(--primary);font-weight:800;text-transform:uppercase;font-size:.72rem}.subtitle{color:var(--text-secondary)}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1rem;box-shadow:var(--shadow-sm)}.cards{display:grid;gap:1rem}.item-grid{display:grid;grid-template-columns:1fr 220px;gap:1rem}.item-title{margin:.1rem 0}.item-desc,.item-meta{color:var(--text-secondary)}.item-form{display:grid;grid-template-columns:1fr;gap:.5rem}.item-form select,.item-form textarea,.item-form input{border:1px solid var(--border);border-radius:12px;padding:.7rem;background:var(--surface-secondary)}.btn{border:0;border-radius:12px;padding:.75rem 1rem;font-weight:800;cursor:pointer}.btn-primary{background:var(--primary);color:#fff}.point-link{display:inline-block;margin-top:.5rem;color:var(--primary);font-weight:800;text-decoration:none}@media(max-width:900px){.item-grid{grid-template-columns:1fr}.audit-page{padding:0 1rem 1.5rem}}
</style>
<script>
const root=document.querySelector('[data-execution-id]'), executionId=root.dataset.executionId, list=document.getElementById('items-list');
const statusLabels={not_tested:'Não testado',conforming:'Conforme',qualified_conforming:'Conforme com ressalva',non_conforming:'Não conforme',not_applicable:'Não aplicável'};
async function load(){const r=await fetch(`/api/internal-audit/executions/${executionId}`);const j=await r.json();if(!j.success){list.innerHTML='<article class="card">Execução não encontrada.</article>';return}const e=j.data;document.getElementById('execution-title').textContent=e.checklist_title||`Execução #${e.id}`;document.getElementById('execution-meta').textContent=`${e.period_label||'Sem período'} · ${e.status}`;list.innerHTML=(e.items||[]).map(item=>`<article class="card"><div class="item-grid"><div><h2 class="item-title">${item.checklist_item_title||'Item'}</h2><p class="item-desc">${item.description_for_report||''}</p><p class="item-meta">Critério: ${item.criterion||'-'} · Evidência esperada: ${item.expected_evidence||'-'}</p>${item.audit_point_id?`<a class="point-link" href="/internal-audit/points?highlight=${item.audit_point_id}">Ponto de auditoria #${item.audit_point_id}</a>`:''}</div><form class="item-form" data-id="${item.id}"><select name="status">${Object.entries(statusLabels).map(([value,label])=>`<option value="${value}" ${item.status===value?'selected':''}>${label}</option>`).join('')}</select><textarea name="comments" placeholder="Comentários do auditor">${item.comments||''}</textarea><input name="justification" placeholder="Justificativa" value="${item.justification||''}"><button class="btn btn-primary">Salvar</button></form></div></article>`).join('')||'<article class="card">Sem itens na execução.</article>';document.querySelectorAll('.item-form').forEach(f=>f.addEventListener('submit',saveItem))}
async function saveItem(e){e.preventDefault();const id=e.target.dataset.id;const data=Object.fromEntries(new FormData(e.target));const r=await fetch(`/api/internal-audit/execution-items/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!j.success){alert(j.message||'Erro');return}if(j.data.audit_point){alert(`Ponto de auditoria criado: #${j.data.audit_point.id}`)}load()}
load();
</script>
{% endblock %}
