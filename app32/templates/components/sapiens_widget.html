<!-- Atalho global do Sapiens: mesma busca de conhecimento da tela /sapiens. -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/sapiens_widget.css') }}?v=20260731-1">

<aside id="sapiens-widget-container" aria-label="Atalho do Sapiens">
    <section id="sapiens-widget-panel" class="sapiens-widget-panel" hidden aria-labelledby="sapiens-widget-title">
        <header class="sapiens-widget-header">
            <div>
                <span class="sapiens-widget-eyebrow">Sapiens</span>
                <h2 id="sapiens-widget-title">Conhecimento e ajuda</h2>
            </div>
            <div class="sapiens-widget-header-actions">
                <a href="/sapiens" aria-label="Abrir Sapiens em tela completa" title="Abrir em tela completa">
                    <i class="fas fa-up-right-from-square" aria-hidden="true"></i>
                </a>
                <button type="button" data-sapiens-close aria-label="Fechar Sapiens">
                    <i class="fas fa-xmark" aria-hidden="true"></i>
                </button>
            </div>
        </header>

        <div class="sapiens-widget-scopes" role="group" aria-label="Escopo da pergunta">
            <button type="button" class="is-active" data-sapiens-scope="all" aria-pressed="true">Todos</button>
            <button type="button" data-sapiens-scope="company" aria-pressed="false">Minha empresa</button>
            <button type="button" data-sapiens-scope="product" aria-pressed="false">APP Versus</button>
        </div>

        <div id="sapiens-widget-messages" class="sapiens-widget-messages" aria-live="polite">
            <div class="sapiens-widget-welcome">
                <i class="fas fa-sparkles" aria-hidden="true"></i>
                <strong>Como posso ajudar?</strong>
                <span>Pergunte sobre processos, decisões ou como usar o APP Versus.</span>
            </div>
        </div>

        <div id="sapiens-widget-status" class="sapiens-widget-status" hidden></div>
        <form id="sapiens-widget-form" class="sapiens-widget-form">
            <label for="sapiens-widget-input" class="sr-only">Faça uma pergunta ao Sapiens</label>
            <textarea id="sapiens-widget-input" rows="1" maxlength="500" placeholder="Faça uma pergunta..."></textarea>
            <button type="submit" aria-label="Perguntar ao Sapiens">
                <i class="fas fa-arrow-up" aria-hidden="true"></i>
            </button>
        </form>
    </section>

    <button id="sapiens-launcher" type="button" aria-expanded="false" aria-controls="sapiens-widget-panel" aria-label="Abrir Sapiens">
        <i class="fas fa-sparkles" aria-hidden="true"></i>
        <span>Sapiens</span>
    </button>
</aside>

<script src="{{ url_for('static', filename='js/sapiens_widget.js') }}?v=20260731-1"></script>
