{% extends "layouts/base.html" %}

{% block body_class %}{{ super() }}{% endblock %}

{% block layout %}
<div class="app-container sidebar-collapsed" id="appContainer">
    <!-- Sidebar - Versus Styled -->
    <aside class="sidebar">
        {% include 'partials/sidebar_standard.html' %}
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
        <header class="header">
            <div class="header-left" style="display: flex; align-items: center;">
                <button class="menu-toggle-btn" onclick="toggleSidebar()" title="Alternar Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="header-breadcrumb">
                    <span style="color: var(--text-tertiary);">Versus</span>
                    <span style="margin: 0 0.5rem; color: var(--text-tertiary);">/</span>
                    <span style="font-weight: 500;">{% block page_title %}Overview{% endblock %}</span>
                </div>
            </div>

            <div class="header-actions" style="display: flex; gap: 1rem; align-items: center;">
                {% block header_actions %}{% endblock %}
            </div>
        </header>

        <main class="main-content fade-in">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</div>

<script>
    // Sidebar toggle logic and persistence
    function toggleSidebar() {
        const container = document.getElementById('appContainer');
        container.classList.toggle('sidebar-collapsed');

        // Persist state
        const isCollapsed = container.classList.contains('sidebar-collapsed');
        localStorage.setItem('sidebarCollapsed', isCollapsed);
    }

    function toggleSidebarGroup(btn) {
        // Find the immediate parent group or subgroup
        const group = btn.parentElement;
        if (group.classList.contains('sidebar-group') || group.classList.contains('sidebar-subgroup')) {
            group.classList.toggle('open');
        } else {
            // Fallback for more complex structures
            const target = btn.closest('.sidebar-subgroup') || btn.closest('.sidebar-group');
            if (target) target.classList.toggle('open');
        }
    }


    // Apply persisted state on load
    document.addEventListener('DOMContentLoaded', () => {
        // Sidebar is collapsed by default in HTML (class="sidebar-collapsed")

        const storedState = localStorage.getItem('sidebarCollapsed');
        const isSmallScreen = window.innerWidth <= 768;

        // If screen is small, we ALWAYS want it collapsed initially (which it is by default HTML)
        // If screen is large, check if user explicitly expanded it (storedState === 'false')
        if (!isSmallScreen && storedState === 'false') {
            document.getElementById('appContainer').classList.remove('sidebar-collapsed');
        }
        // Otherwise, leave it collapsed (default) or re-enforce if needed
    });
</script>
{% endblock %}
