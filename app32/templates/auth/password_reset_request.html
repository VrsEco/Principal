<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir senha | Gestão Versus</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Segoe UI,Arial,sans-serif;background:#f3f6fc;color:#102542}
    main{width:min(430px,100%);padding:32px;border-radius:18px;background:#fff;box-shadow:0 16px 40px #10254220}
    label,input,button{display:block;width:100%} label{font-weight:600;margin:22px 0 8px} input{box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit} button{margin-top:18px;padding:12px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:600 15px inherit;cursor:pointer} #message{min-height:24px;line-height:1.45;margin-top:16px}.muted{color:#4b6285;font-size:14px;line-height:1.5}a{color:#1d4ed8}
  </style>
</head>
<body>
  <main>
    <h1>Redefinir senha</h1>
    <p class="muted">Informe seu e-mail corporativo. Se houver uma conta ativa, enviaremos um link temporário.</p>
    <form id="reset-request-form">
      <label for="email">E-mail corporativo</label>
      <input id="email" type="email" autocomplete="email" maxlength="120" required>
      <button type="submit">Enviar link</button>
    </form>
    <p id="message" aria-live="polite"></p>
    <p class="muted"><a href="/login">Voltar ao acesso</a></p>
  </main>
  <script>
    document.getElementById('reset-request-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = event.currentTarget.querySelector('button');
      const message = document.getElementById('message');
      button.disabled = true;
      try {
        const response = await fetch('/password-reset', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email: document.getElementById('email').value})
        });
        const data = await response.json();
        message.textContent = data.message || 'Não foi possível processar a solicitação.';
      } catch (_) {
        message.textContent = 'Não foi possível processar a solicitação. Tente novamente mais tarde.';
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
