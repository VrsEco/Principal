<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova senha | Gestão Versus</title>
  <meta name="referrer" content="no-referrer">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Segoe UI,Arial,sans-serif;background:#f3f6fc;color:#102542}
    main{width:min(430px,100%);padding:32px;border-radius:18px;background:#fff;box-shadow:0 16px 40px #10254220}
    label,input,button{display:block;width:100%} label{font-weight:600;margin:18px 0 8px} input{box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit} button{margin-top:20px;padding:12px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:600 15px inherit;cursor:pointer} #message{min-height:24px;line-height:1.45;margin-top:16px}.muted{color:#4b6285;font-size:14px;line-height:1.5}
  </style>
</head>
<body>
  <main>
    <h1>Defina uma nova senha</h1>
    <p class="muted">Use pelo menos 12 caracteres. Este link é válido uma única vez.</p>
    <form id="reset-complete-form">
      <label for="new-password">Nova senha</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="confirm-password">Confirmar nova senha</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required>
      <button type="submit">Salvar nova senha</button>
    </form>
    <p id="message" aria-live="polite"></p>
  </main>
  <script>
    const resetToken = {{ token|tojson }};
    document.getElementById('reset-complete-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = event.currentTarget.querySelector('button');
      const message = document.getElementById('message');
      button.disabled = true;
      try {
        const response = await fetch('/password-reset/' + encodeURIComponent(resetToken), {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            new_password: document.getElementById('new-password').value,
            confirm_password: document.getElementById('confirm-password').value
          })
        });
        const data = await response.json();
        message.textContent = data.message || 'Não foi possível concluir a redefinição.';
        if (data.success) setTimeout(() => { window.location.href = data.redirect || '/login'; }, 700);
      } catch (_) {
        message.textContent = 'Não foi possível concluir a redefinição. Solicite um novo link.';
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
