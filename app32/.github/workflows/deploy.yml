name: 🚀 Deploy to Production (Cloudez)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH to Cloudez
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            set -e
            echo "📂 Atualizando código..."
            cd ${{ secrets.PROJECT_PATH }}
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Instalando/atualizando dependências Python..."
            PIP=/srv/appgestaoversuscombr.45a4cd4b.configr.cloud/.virtualenv/3.12/bin/pip
            $PIP install -r requirements.txt --quiet

            echo "🗃️ Executando migrations do banco de dados..."
            PYTHON=/srv/appgestaoversuscombr.45a4cd4b.configr.cloud/.virtualenv/3.12/bin/python
            set +e
            $PYTHON -c "
            import sys, os
            sys.path.insert(0, '.')
            from dotenv import load_dotenv
            load_dotenv('.env')
            os.environ.setdefault('FLASK_CONFIG', 'production')
            from flask_migrate import upgrade
            from app import create_app
            app = create_app('production')
            with app.app_context():
                upgrade()
            print('✅ Migrations OK')
            " 2>&1 || echo "⚠️  Migrations falharam ou não há migrações pendentes"
            set -e

            echo "🔄 Reiniciando o servidor..."
            touch /srv/appgestaoversuscombr.45a4cd4b.configr.cloud/www/tmp/restart.txt
            touch /srv/appgestaoversuscombr.45a4cd4b.configr.cloud/etc/uwsgi/uwsgi.ini

            echo "✅ Deploy concluído com sucesso!"
