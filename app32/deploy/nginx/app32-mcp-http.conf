# Snippet sugerido para reverse proxy do MCP remoto APP32.
# Ajustar conforme o layout final do Configr/Nginx.

location /mcp/user {
    proxy_pass http://127.0.0.1:8101/mcp/user;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
}

location /mcp/admin {
    proxy_pass http://127.0.0.1:8101/mcp/admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
}

location /mcp/analytics {
    proxy_pass http://127.0.0.1:8101/mcp/analytics;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
