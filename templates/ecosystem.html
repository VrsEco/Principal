<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecossistema Versus - Anotações</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}" />
  <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ecosystem.css') }}" />
</head>

<body data-notes-endpoint="{{ url_for('notes.list_notes') }}">
  <!-- Sidebar Navigation -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo-container">
        <h2 class="sidebar-logo">Versus</h2>
        <p class="sidebar-subtitle">Gestão</p>
      </div>
      <button class="toggle-btn desktop-toggle" id="sidebarToggle" title="Recolher menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
    </div>

    <nav>
      <div class="sidebar-section">
        <h3 class="sidebar-section-title">Módulos</h3>
        {% if module_links.get('pev') %}
        <a href="{{ module_links.pev }}" class="sidebar-link" title="PEV - Planejamento">
          <span class="sidebar-icon">📊</span>
          <span class="link-text">PEV - Planejamento</span>
        </a>
        {% endif %}

        {% if module_links.get('grv') %}
        <a href="{{ module_links.grv }}" class="sidebar-link" title="GRV - Rotina">
          <span class="sidebar-icon">🔄</span>
          <span class="link-text">GRV - Rotina</span>
        </a>
        {% endif %}

        <a href="/main" class="sidebar-link active" title="Anotações">
          <span class="sidebar-icon">📝</span>
          <span class="link-text">Anotações</span>
        </a>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-section-title">Sistema</h3>
        <a href="/integrations" class="sidebar-link" title="Integrações">
          <span class="sidebar-icon">🔌</span>
          <span class="link-text">Integrações</span>
        </a>
        <a href="/configs-system" class="sidebar-link" title="Configurações">
          <span class="sidebar-icon">⚙️</span>
          <span class="link-text">Configurações</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-logout">
      <a href="/logout" class="sidebar-link" title="Sair">
        <span class="sidebar-icon">🚪</span>
        <span class="link-text">Sair</span>
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <div class="page">
      <header class="hero">
        <div class="hero-header-row">
          <button class="menu-trigger" id="mobileMenuBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <h1 class="hero-title">Anotações</h1>
        </div>
      </header>

      <section class="grid notes-panel">
        <article class="card">
          <h2 class="card-title">Nova anotação</h2>
          <form class="note-form" id="noteForm">
            <textarea id="noteText" name="noteText" placeholder="Descreva a anotação..." required></textarea>
            <div class="note-actions-row">
              <button type="submit" class="btn">Salvar nota</button>
            </div>
          </form>
        </article>

        <article class="card">
          <h2 class="card-title">Notas em andamento</h2>
          <div class="notes-list" id="noteBoard"></div>
          <div class="note-controls">
            <button class="btn-primary" id="action-create" disabled>Criar atividade</button>
            <button class="btn-secondary" id="action-edit" disabled>Editar</button>
            <button class="btn-danger" id="action-delete" disabled>Excluir</button>
          </div>
        </article>
      </section>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/ecosystem.js') }}"></script>
  <script src="{{ url_for('static', filename='js/notes.js') }}"></script>
  <script src="{{ url_for('static', filename='js/notes-drag-drop.js') }}"></script>

</body>

</html>
