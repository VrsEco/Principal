name: Deploy to Configr

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: 🧪 Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # Apenas checagem de sintaxe para ser rápido
          
      - name: Check Syntax (Flake8)
        run: |
          # Checa apenas erros fatais e de sintaxe (E9, F63, F7, F82)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy:
    name: 🚀 Deploy to Configr
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CONFIGR_HOST }}
          username: ${{ secrets.CONFIGR_USER }}
          key: ${{ secrets.CONFIGR_SSH_PRIVATE_KEY }}
          port: ${{ secrets.CONFIGR_PORT }}
          script: |
            cd /home/app2/public_html
            
            # Atualizar código (Monorepo)
            git fetch origin main
            git reset --hard origin/main
            
            # Entrar na pasta do APP de produção atual (app32)
            cd app32
            
            # Ativar venv e atualizar (Pode estar no root ou dentro do app)
            if [ -d "../venv" ]; then
              source ../venv/bin/activate
            elif [ -d "../.venv" ]; then
              source ../.venv/bin/activate
            elif [ -d "venv" ]; then
              source venv/bin/activate
            fi
            
            pip install -r requirements.txt
            
            # Migrações (usando app.py como principal)
            export FLASK_APP=app.py
            # flask db upgrade  # Descomente quando o Alembic estiver configurado no app32
            
            # Restart da aplicação (Apache/Passenger no Configr)
            # Geralmente o tmp/restart.txt fica na raiz de cada app no Passenger
            mkdir -p tmp
            touch tmp/restart.txt
            
            # Se o servidor usa um passenger_wsgi.py na raiz de public_html, 
            # você precisará garantir que ele aponte para app32.app:app
            
            echo "✅ Deploy do APP32 concluído com sucesso em $(date)"
