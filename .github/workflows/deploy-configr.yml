name: Deploy to Configr

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CONFIGR_HOST }}
          username: ${{ secrets.CONFIGR_USER }}
          key: ${{ secrets.CONFIGR_SSH_PRIVATE_KEY }}
          port: ${{ secrets.CONFIGR_PORT }}
          script: |
            cd /home/app2/public_html
            
            # Atualizar código
            git fetch origin main
            git reset --hard origin/main
            
            # Ativar venv e atualizar
            if [ -d "venv" ]; then
              source venv/bin/activate
            elif [ -d ".venv" ]; then
              source .venv/bin/activate
            fi
            
            pip install -r requirements.txt
            
            # Migrações
            export FLASK_APP=app_pev.py
            flask db upgrade
            
            # Restart
            mkdir -p tmp
            touch tmp/restart.txt
            
            echo "Deploy concluído com sucesso."
