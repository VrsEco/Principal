name: Deploy to Configr

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: 🧪 Validate Code
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # Apenas checagem de sintaxe para ser rápido
          
      - name: Check Syntax (Flake8)
        run: |
          # Checa apenas erros fatais e de sintaxe (E9, F63, F7, F82)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy:
    name: 🚀 Deploy to Configr
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CONFIGR_HOST }}
          username: ${{ secrets.CONFIGR_USER }}
          key: ${{ secrets.CONFIGR_SSH_PRIVATE_KEY }}
          port: ${{ secrets.CONFIGR_PORT }}
          script: |
            cd /home/app2/public_html
            
            # 1. Sincronizar Código (Monorepo)
            echo "📥 Sincronizando repositório do GitHub..."
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Processar APP31 (Legado/Ativo)
            if [ -d "app31" ]; then
              echo "⚙️ Atualizando APP31 (Produção)..."
              # Ativar venv (tenta local ou root)
              if [ -d "app31/venv" ]; then source app31/venv/bin/activate
              elif [ -d "app31/.venv" ]; then source app31/.venv/bin/activate
              elif [ -d "venv" ]; then source venv/bin/activate
              fi
              
              pip install -r app31/requirements.txt
              mkdir -p app31/tmp
              touch app31/tmp/restart.txt
            fi
            
            # 3. Processar APP32 (Nova Estrutura/Beta)
            if [ -d "app32" ]; then
              echo "🧪 Atualizando APP32 (Desenvolvimento)..."
              # Se o venv for compartilhado no root ou dentro do app
              pip install -r app32/requirements.txt
              mkdir -p app32/tmp
              touch app32/tmp/restart.txt
            fi
            
            # 4. Restart Global (Passenger/Configr)
            mkdir -p tmp
            touch tmp/restart.txt
            
            echo "✅ Deploy Monorepo concluído em $(date)"
