name: 🚀 Deploy App32 to Production (Cloudez)
run-name: "Deploy app32 (${{ inputs.mode }}) · ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo do deploy"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - standard
          - full
      restart_mcp:
        description: "Reiniciar e validar o runtime MCP"
        required: true
        default: false
        type: boolean
      preserve_remote_drift:
        description: "Criar snapshot auditável do drift remoto antes do reset (exceção aprovada)"
        required: true
        default: false
        type: boolean
      deployment_id:
        description: "ID de correlação do ledger MCP (obrigatório para agentes)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: app32-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: 🧪 Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Registrar contexto imutável do release
        run: |
          {
            echo "## Contexto do deploy"
            echo "- Correlation ID: \`${{ inputs.deployment_id || 'manual-unlinked' }}\`"
            echo "- Actor: \`${{ github.actor }}\`"
            echo "- Triggering actor: \`${{ github.triggering_actor }}\`"
            echo "- Run: \`${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\`"
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- SHA: \`${{ github.sha }}\`"
            echo "- Modo: \`${{ inputs.mode }}\` | restart_mcp: \`${{ inputs.restart_mcp }}\`"
            echo "- Preservar drift remoto: \`${{ inputs.preserve_remote_drift }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🛡️ Validar proveniência do agente
        shell: bash
        run: |
          actor="${{ github.actor }}"
          correlation_id="${{ inputs.deployment_id }}"
          is_deploy_bot=false
          case "$actor" in
            "gv-codex-deploy[bot]"|"gv-claude-deploy[bot]") is_deploy_bot=true ;;
          esac
          if [ "$is_deploy_bot" = true ] && [ -z "$correlation_id" ]; then
            echo "Deploy de agente sem deployment_id MCP é bloqueado."
            exit 1
          fi
          if [ -n "$correlation_id" ] && [ "$is_deploy_bot" != true ]; then
            echo "Somente GitHub Apps do Squad Engenharia podem usar deployment_id MCP."
            exit 1
          fi
          if [ "${{ inputs.preserve_remote_drift }}" = "true" ] && [ "$is_deploy_bot" = true ]; then
            echo "Exceção de drift é exclusiva de dispatch humano aprovado no ambiente production."
            exit 1
          fi

      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: 🔍 Check Syntax (Flake8)
        run: |
          # Checa apenas erros fatais e de sintaxe (E9, F63, F7, F82)
          # O .flake8 na raiz também exclui artefatos temporários locais/Codex.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy:
    name: 🚀 Deploy via SSH
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: 🛡️ Validar proveniência do agente
        shell: bash
        run: |
          actor="${{ github.actor }}"
          correlation_id="${{ inputs.deployment_id }}"
          is_deploy_bot=false
          case "$actor" in
            "gv-codex-deploy[bot]"|"gv-claude-deploy[bot]") is_deploy_bot=true ;;
          esac
          if [ "$is_deploy_bot" = true ] && [ -z "$correlation_id" ]; then
            echo "Deploy de agente sem deployment_id MCP é bloqueado."
            exit 1
          fi
          if [ -n "$correlation_id" ] && [ "$is_deploy_bot" != true ]; then
            echo "Somente GitHub Apps do Squad Engenharia podem usar deployment_id MCP."
            exit 1
          fi
          if [ "${{ inputs.preserve_remote_drift }}" = "true" ] && [ "$is_deploy_bot" = true ]; then
            echo "Exceção de drift é exclusiva de dispatch humano aprovado no ambiente production."
            exit 1
          fi

      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            set -e
            echo "📂 Acessando diretório do projeto..."
            cd ${{ secrets.PROJECT_PATH }}

            # Bootstrap: o script no host ainda pode ser anterior à lógica de
            # snapshot. O snapshot é criado aqui, antes de invocá-lo, somente
            # após a aprovação do ambiente production e apenas no dispatch humano.
            if [ "${{ inputs.preserve_remote_drift }}" = "true" ]; then
              # PROJECT_PATH pode ser o runtime ($WWW/app32), e não a raiz
              # Git ($WWW). Derivar o checkout real preserva o contrato do
              # deploy_configr.sh: snapshots auditáveis ficam em $BASE/backups.
              REPO="$(git rev-parse --show-toplevel)"
              BASE="$(cd "$REPO/.." && pwd -P)"
              WORKTREE_DRIFT="$(git -C "$REPO" status --porcelain=v1)"
              if [ -n "$WORKTREE_DRIFT" ]; then
                STAMP="$(date +%Y%m%d-%H%M%S)"
                SNAPSHOT_DIR="$BASE/backups/worktree-drift-$STAMP"
                UNTRACKED_ARCHIVE="$SNAPSHOT_DIR/untracked-files.tar.gz"

                (umask 077; mkdir -p "$SNAPSHOT_DIR")
                chmod 0700 "$SNAPSHOT_DIR"
                git -C "$REPO" status --porcelain=v1 > "$SNAPSHOT_DIR/status.txt"
                git -C "$REPO" diff --binary > "$SNAPSHOT_DIR/worktree.patch"
                git -C "$REPO" diff --cached --binary > "$SNAPSHOT_DIR/staged.patch"
                (
                  cd "$REPO"
                  git ls-files --others --exclude-standard -z |
                    tar --null --files-from=- -czf "$UNTRACKED_ARCHIVE" 2>/dev/null || true
                )
                [ -f "$UNTRACKED_ARCHIVE" ] && chmod 0600 "$UNTRACKED_ARCHIVE"
                {
                  printf 'snapshot=%s\n' "$SNAPSHOT_DIR"
                  printf 'created_at=%s\n' "$(date --iso-8601=seconds)"
                  printf 'release_before_reset=%s\n' "$(git -C "$REPO" rev-parse HEAD)"
                  printf 'approved_by=%s\n' "${{ github.actor }}"
                  printf 'workflow_run=%s\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                } > "$SNAPSHOT_DIR/manifest.txt"
                chmod 0600 "$SNAPSHOT_DIR/manifest.txt" "$SNAPSHOT_DIR/status.txt" \
                  "$SNAPSHOT_DIR/worktree.patch" "$SNAPSHOT_DIR/staged.patch"
                test -s "$SNAPSHOT_DIR/manifest.txt"
                export DEPLOY_DIRTY_SNAPSHOT="$SNAPSHOT_DIR/manifest.txt"
                echo "✅ Snapshot privado do drift criado antes do deploy."
              fi
            fi

            if [ -f "app32/scripts/deploy_configr.sh" ]; then
              echo "🚀 Executando deploy oficial via app32/scripts/deploy_configr.sh"
              DEPLOY_MODE="${{ inputs.mode }}" RESTART_MCP="${{ inputs.restart_mcp }}" DEPLOY_ALLOW_DIRTY="${{ inputs.preserve_remote_drift }}" DEPLOY_CREATE_DIRTY_SNAPSHOT="${{ inputs.preserve_remote_drift }}" DEPLOY_DRIFT_APPROVED_BY="${{ github.actor }}" DEPLOY_DRIFT_WORKFLOW_RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" bash app32/scripts/deploy_configr.sh
            elif [ -f "scripts/deploy_configr.sh" ]; then
              echo "🚀 Executando deploy oficial via scripts/deploy_configr.sh"
              DEPLOY_MODE="${{ inputs.mode }}" RESTART_MCP="${{ inputs.restart_mcp }}" DEPLOY_ALLOW_DIRTY="${{ inputs.preserve_remote_drift }}" DEPLOY_CREATE_DIRTY_SNAPSHOT="${{ inputs.preserve_remote_drift }}" DEPLOY_DRIFT_APPROVED_BY="${{ github.actor }}" DEPLOY_DRIFT_WORKFLOW_RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" bash scripts/deploy_configr.sh
            else
              echo "❌ Script oficial de deploy não encontrado."
              find . -maxdepth 3 -name "deploy_configr.sh" -print
              exit 1
            fi

      - name: 🧾 Registrar resultado do deploy
        if: always()
        run: |
          {
            echo "## Resultado do deploy"
            echo "- Status do job: \`${{ job.status }}\`"
            echo "- Actor verificável: \`${{ github.actor }}\`"
            echo "- Triggering actor verificável: \`${{ github.triggering_actor }}\`"
            echo "- Correlation ID MCP: \`${{ inputs.deployment_id || 'manual-unlinked' }}\`"
            echo "- Exceção de drift solicitada: \`${{ inputs.preserve_remote_drift }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
