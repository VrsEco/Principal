name: 🚀 Deploy App32 to Production (Cloudez)
run-name: "Deploy app32 (${{ inputs.mode }}) · ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: "Inventário somente leitura; não executa deploy"
        required: true
        default: false
        type: boolean
      mode:
        description: "Modo do deploy"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - standard
          - full
      restart_mcp:
        description: "Reiniciar e validar o runtime MCP"
        required: true
        default: false
        type: boolean
      remediate_chartjs_runtime_drift:
        description: "Contingência aprovada: preservar e remover somente o drift Chart.js legado"
        required: true
        default: false
        type: boolean
      remediate_process_architecture_runtime_drift:
        description: "Contingência humana: snapshot e restauração do asset de processos legado"
        required: true
        default: false
        type: boolean
      deployment_id:
        description: "ID de correlação do ledger MCP (obrigatório para agentes)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: app32-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: 🧪 Validate Code
    runs-on: ubuntu-24.04
    steps:
      - name: 🧾 Registrar contexto imutável do release
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          {
            echo "## Contexto do deploy"
            echo "- Correlation ID: \`${DEPLOYMENT_ID:-manual-unlinked}\`"
            echo "- Actor: \`${{ github.actor }}\`"
            echo "- Triggering actor: \`${{ github.triggering_actor }}\`"
            echo "- Run: \`${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\`"
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- SHA: \`${{ github.sha }}\`"
            echo "- Modo: \`${{ inputs.mode }}\` | restart_mcp: \`${{ inputs.restart_mcp }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ✅ Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 📦 Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: 🔍 Check Syntax (Flake8)
        run: |
          # Checa apenas erros fatais e de sintaxe (E9, F63, F7, F82)
          # O .flake8 na raiz também exclui artefatos temporários locais/Codex.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy:
    if: ${{ !inputs.diagnostic_only }}
    name: 🚀 Deploy via SSH
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: production
    permissions:
      contents: read
      id-token: write # somente para o callback OIDC ao ledger; sem segredo de longa duração
    env:
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      CALLBACK_URL: ${{ vars.APP32_DEPLOY_CALLBACK_URL }}
      OIDC_AUDIENCE: ${{ vars.APP32_DEPLOY_OIDC_AUDIENCE }}
      APP32_PUBLIC_BASE_URL: ${{ vars.APP32_PUBLIC_BASE_URL }}
    steps:
      - name: 🛡️ Validar proveniência e correlação
        shell: bash
        run: |
          if [ "${{ inputs.remediate_chartjs_runtime_drift }}" = "true" ] && \
             { [ "$ACTOR" = "gv-codex-deploy[bot]" ] || [ "$ACTOR" = "gv-claude-deploy[bot]" ]; }; then
            echo "Contingência de drift Chart.js exige operador humano; agentes não podem autorizá-la."
            exit 1
          fi
          if [ "${{ inputs.remediate_process_architecture_runtime_drift }}" = "true" ]; then
            if [ "$ACTOR" != "VrsEco" ] || [ "$TRIGGERING_ACTOR" != "VrsEco" ] || \
               [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "Contingência process_architecture.js exige dispatch humano VrsEco em main."
              exit 1
            fi
            if [ "${{ inputs.remediate_chartjs_runtime_drift }}" = "true" ] || \
               [ "${{ inputs.mode }}" != "quick" ] || [ "${{ inputs.restart_mcp }}" != "false" ]; then
              echo "Contingência process_architecture.js exige modo quick, restart_mcp=false e nenhuma outra contingência."
              exit 1
            fi
          fi
          case "$ACTOR" in
            "gv-codex-deploy[bot]"|"gv-claude-deploy[bot]")
              if [ -z "$DEPLOYMENT_ID" ]; then
                echo "Deploy de agente sem deployment_id MCP é bloqueado."
                exit 1
              fi ;;
          esac
          if [ -n "$DEPLOYMENT_ID" ] && ! [[ "$DEPLOYMENT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "deployment_id inválido."
            exit 1
          fi
          if [ -n "$DEPLOYMENT_ID" ] && { [ -z "$CALLBACK_URL" ] || [ -z "$OIDC_AUDIENCE" ]; }; then
            echo "Callback do ledger não configurado (APP32_DEPLOY_CALLBACK_URL/APP32_DEPLOY_OIDC_AUDIENCE)."
            exit 1
          fi

      - name: ✅ Checkout code
        uses: actions/checkout@v5

      - name: 🔒 Confirmar blob alvo da contingência de processos
        if: ${{ inputs.remediate_process_architecture_runtime_drift }}
        shell: bash
        run: |
          actual="$(git hash-object static/js/process_architecture.js)"
          if [ "$actual" != "6290998521a2e28d64cd94223698184ebfcdd20c" ]; then
            echo "Asset alvo divergiu do blob aprovado; contingência recusada."
            exit 1
          fi

      - name: 🧾 Ledger — iniciar (recusa deploy não aprovado, de outro SHA ou de outro run)
        if: env.DEPLOYMENT_ID != ''
        shell: bash
        run: bash app32/scripts/deploy_callback.sh started

      - name: 🚀 Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            set -e
            echo "📂 Acessando diretório do projeto..."
            cd ${{ secrets.PROJECT_PATH }}

            # O boot legado preservava mtime/ctime de cópias de assets e podia
            # deixar o índice com falso positivo. Atualizar o stat-cache não
            # toca conteúdo nem staging; alterações reais continuam visíveis e
            # são recusadas pelas guardas abaixo e pelo script oficial.
            set +e
            # A forma curta -q é compatível com o Git do host Configr;
            # --quiet não é reconhecido nessa versão.
            git update-index --refresh -q
            INDEX_REFRESH_EXIT=$?
            set -e
            echo "ℹ️ Índice Git atualizado antes da avaliação de drift (refresh_exit=$INDEX_REFRESH_EXIT)."

            # Contingência estritamente limitada ao resíduo de uma versão anterior
            # do deploy que copiou Chart.js para o root público. O snapshot é
            # criado antes de qualquer remoção e qualquer drift adicional aborta.
            if [ "${{ inputs.remediate_chartjs_runtime_drift }}" = "true" ]; then
              START_DIR="$(pwd -P)"
              REPO="$(git -C "$START_DIR" rev-parse --show-toplevel)"
              DRIFT_STATUS="$(git -C "$REPO" status --porcelain=v1)"
              UNTRACKED="$(git -C "$REPO" ls-files --others --exclude-standard)"
              EXPECTED_UNTRACKED=$'static/vendor/chartjs/chart.umd.min.js\nstatic/vendor/chartjs/chartjs-adapter-date-fns.bundle.min.js'

              if git -C "$REPO" diff --quiet; then DIFF_EXIT=0; else DIFF_EXIT=$?; fi
              if git -C "$REPO" diff --cached --quiet; then STAGED_DIFF_EXIT=0; else STAGED_DIFF_EXIT=$?; fi

              echo "ℹ️ Evidência da contingência Chart.js: start_dir=$START_DIR repo=$REPO"
              printf 'ℹ️ drift_status=<%s>\n' "$DRIFT_STATUS"
              printf 'ℹ️ untracked=<%s>\n' "$UNTRACKED"
              printf 'ℹ️ diff_exit=%s staged_diff_exit=%s\n' "$DIFF_EXIT" "$STAGED_DIFF_EXIT"

              if [ "$DIFF_EXIT" -ne 0 ] || [ "$STAGED_DIFF_EXIT" -ne 0 ] || \
                 [ "$DRIFT_STATUS" != "?? static/vendor/chartjs/" ] || \
                 [ "$UNTRACKED" != "$EXPECTED_UNTRACKED" ]; then
                echo "❌ Drift não corresponde exatamente aos dois assets Chart.js legados; contingência recusada."
                git -C "$REPO" status --porcelain=v1
                exit 1
              fi

              CHART_DIR="$REPO/static/vendor/chartjs"
              if [ ! -f "$CHART_DIR/chart.umd.min.js" ] || [ -L "$CHART_DIR/chart.umd.min.js" ] || \
                 [ ! -f "$CHART_DIR/chartjs-adapter-date-fns.bundle.min.js" ] || [ -L "$CHART_DIR/chartjs-adapter-date-fns.bundle.min.js" ]; then
                echo "❌ Assets Chart.js não são arquivos regulares seguros para a contingência."
                exit 1
              fi

              STAMP="$(date +%Y%m%d-%H%M%S)"
              SNAPSHOT_DIR="$REPO/../backups/worktree-drift-$STAMP"
              umask 077
              mkdir -p "$SNAPSHOT_DIR"
              printf '%s\n' "$DRIFT_STATUS" > "$SNAPSHOT_DIR/status-before.txt"
              tar -C "$REPO" -czf "$SNAPSHOT_DIR/chartjs-runtime-assets.tar.gz" \
                static/vendor/chartjs/chart.umd.min.js \
                static/vendor/chartjs/chartjs-adapter-date-fns.bundle.min.js
              sha256sum "$SNAPSHOT_DIR/chartjs-runtime-assets.tar.gz" > "$SNAPSHOT_DIR/chartjs-runtime-assets.sha256"
              printf 'snapshot=%s\ncreated_at=%s\n' "$SNAPSHOT_DIR" "$(date --iso-8601=seconds)" > "$SNAPSHOT_DIR/manifest.txt"

              rm -f -- "$CHART_DIR/chart.umd.min.js" "$CHART_DIR/chartjs-adapter-date-fns.bundle.min.js"
              rmdir -- "$CHART_DIR"

              if [ -n "$(git -C "$REPO" status --porcelain=v1)" ]; then
                echo "❌ Worktree ainda possui alterações após a contingência; deploy interrompido."
                git -C "$REPO" status --porcelain=v1
                exit 1
              fi
              echo "✅ Drift Chart.js legado preservado e removido com escopo controlado: $SNAPSHOT_DIR"
            fi

            # Contingência temporária: o boot antigo copiou o JS legado para
            # o static público. Nunca aceitar conteúdo diferente do blob
            # identificado, nem qualquer outro drift no checkout.
            if [ "${{ inputs.remediate_process_architecture_runtime_drift }}" = "true" ]; then
              START_DIR="$(pwd -P)"
              REPO="$(git -C "$START_DIR" rev-parse --show-toplevel)"
              ASSET="static/js/process_architecture.js"
              ASSET_PATH="$REPO/$ASSET"
              EXPECTED_STALE_BLOB="8b5c5f783a22a010d757a051b3e22709bce0b3ed"
              DRIFT_STATUS="$(git -C "$REPO" status --porcelain=v1)"
              UNTRACKED="$(git -C "$REPO" ls-files --others --exclude-standard)"
              if git -C "$REPO" diff --quiet; then DIFF_EXIT=0; else DIFF_EXIT=$?; fi
              if git -C "$REPO" diff --cached --quiet; then STAGED_DIFF_EXIT=0; else STAGED_DIFF_EXIT=$?; fi

              if [ ! -f "$ASSET_PATH" ] || [ -L "$ASSET_PATH" ] || \
                 [ -L "$REPO/static" ] || [ -L "$REPO/static/js" ]; then
                echo "❌ Asset de processos ausente ou ligado por symlink; contingência recusada."
                exit 1
              fi
              ACTUAL_BLOB="$(git -C "$REPO" hash-object "$ASSET_PATH")"
              REMOTE_MAIN_SHA="$(git -C "$REPO" ls-remote origin refs/heads/main | cut -f1)"
              printf 'ℹ️ Drift: status=<%s> untracked=<%s> diff=%s staged=%s blob=%s main=%s\n' \
                "$DRIFT_STATUS" "$UNTRACKED" "$DIFF_EXIT" "$STAGED_DIFF_EXIT" "$ACTUAL_BLOB" "$REMOTE_MAIN_SHA"

              if [ "$DRIFT_STATUS" != " M static/js/process_architecture.js" ] || \
                 [ -n "$UNTRACKED" ] || [ "$DIFF_EXIT" -ne 1 ] || [ "$STAGED_DIFF_EXIT" -ne 0 ] || \
                 [ "$ACTUAL_BLOB" != "$EXPECTED_STALE_BLOB" ] || \
                 [ "$REMOTE_MAIN_SHA" != "${{ github.sha }}" ]; then
                echo "❌ Drift, blob ou SHA de main fora da janela aprovada; nenhuma restauração executada."
                exit 1
              fi

              if [ ! -d "$REPO/../backups" ] || [ -L "$REPO/../backups" ]; then
                echo "❌ Diretório externo de backups ausente ou ligado por symlink."
                exit 1
              fi
              BACKUPS="$(realpath -e "$REPO/../backups")"
              case "$BACKUPS" in
                "$REPO"|"$REPO"/*) echo "❌ Backup não pode ficar dentro do checkout."; exit 1 ;;
              esac
              STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
              SNAPSHOT_DIR="$BACKUPS/worktree-drift-process-architecture-${{ github.run_id }}-$STAMP"
              PREVIOUS_UMASK="$(umask)"
              umask 077
              if [ -e "$SNAPSHOT_DIR" ]; then
                echo "❌ Diretório de snapshot já existe; contingência recusada."
                exit 1
              fi
              mkdir -m 0700 -- "$SNAPSHOT_DIR"
              printf '%s\n' "$DRIFT_STATUS" > "$SNAPSHOT_DIR/status-before.txt"
              cat -- "$ASSET_PATH" > "$SNAPSHOT_DIR/process_architecture.js"
              git -C "$REPO" diff --binary -- "$ASSET" > "$SNAPSHOT_DIR/process_architecture.patch"
              printf 'snapshot=%s\ncreated_at=%s\nsource=%s\nold_blob=%s\nhead_sha=%s\ntarget_sha=%s\nrun_id=%s\nactor=%s\n' \
                "$SNAPSHOT_DIR" "$(date --iso-8601=seconds)" "$ASSET" "$ACTUAL_BLOB" \
                "$(git -C "$REPO" rev-parse HEAD)" "${{ github.sha }}" "${{ github.run_id }}" "$ACTOR" \
                > "$SNAPSHOT_DIR/manifest.txt"
              if [ ! -s "$SNAPSHOT_DIR/process_architecture.patch" ] || \
                 [ "$(git -C "$REPO" hash-object "$SNAPSHOT_DIR/process_architecture.js")" != "$EXPECTED_STALE_BLOB" ]; then
                echo "❌ Snapshot incompleto; nenhuma restauração executada."
                exit 1
              fi
              (cd "$SNAPSHOT_DIR" && \
                sha256sum process_architecture.js process_architecture.patch status-before.txt manifest.txt > SHA256SUMS && \
                sha256sum -c SHA256SUMS)
              if [ "$(git -C "$REPO" hash-object "$ASSET_PATH")" != "$EXPECTED_STALE_BLOB" ]; then
                echo "❌ Asset mudou após o snapshot; nenhuma restauração executada."
                exit 1
              fi
              umask "$PREVIOUS_UMASK"

              git -C "$REPO" checkout -- "$ASSET"
              if [ -n "$(git -C "$REPO" status --porcelain=v1)" ]; then
                echo "❌ Worktree ainda possui alterações após a restauração controlada."
                git -C "$REPO" status --porcelain=v1
                exit 1
              fi
              echo "✅ Drift legado preservado e restaurado: $SNAPSHOT_DIR"
              cat "$SNAPSHOT_DIR/SHA256SUMS"

              # O script instalado no host ainda pode ser anterior à validação
              # DEPLOY_EXPECTED_SHA. Fazemos bootstrap do SHA exato somente
              # após o snapshot e com o worktree comprovadamente limpo.
              git -C "$REPO" fetch origin +refs/heads/main:refs/remotes/origin/main
              FETCHED_MAIN_SHA="$(git -C "$REPO" rev-parse origin/main)"
              if [ "$FETCHED_MAIN_SHA" != "${{ github.sha }}" ]; then
                echo "❌ main avançou entre preflight e fetch; reset de bootstrap recusado."
                exit 1
              fi
              if [ -n "$(git -C "$REPO" status --porcelain=v1)" ]; then
                echo "❌ Novo drift surgiu durante o fetch; reset de bootstrap recusado."
                git -C "$REPO" status --porcelain=v1
                exit 1
              fi
              git -C "$REPO" reset --hard "${{ github.sha }}"
              if ! grep -q 'DEPLOY_EXPECTED_SHA' "$REPO/app32/scripts/deploy_configr.sh"; then
                echo "❌ Script oficial atualizado não contém guarda de SHA; deploy interrompido."
                exit 1
              fi
              # O host pode iniciar o workflow com umask 077. O caminho é
              # público no Nginx; garantir leitura sem expor outros arquivos.
              chmod 0755 "$REPO/static" "$REPO/static/js"
              chmod 0644 "$ASSET_PATH"
            fi

            if [ -f "app32/scripts/deploy_configr.sh" ]; then
              echo "🚀 Executando deploy oficial via app32/scripts/deploy_configr.sh"
              DEPLOY_MODE="${{ inputs.mode }}" RESTART_MCP="${{ inputs.restart_mcp }}" DEPLOY_EXPECTED_SHA="${{ github.sha }}" bash app32/scripts/deploy_configr.sh
            elif [ -f "scripts/deploy_configr.sh" ]; then
              echo "🚀 Executando deploy oficial via scripts/deploy_configr.sh"
              DEPLOY_MODE="${{ inputs.mode }}" RESTART_MCP="${{ inputs.restart_mcp }}" DEPLOY_EXPECTED_SHA="${{ github.sha }}" bash scripts/deploy_configr.sh
            else
              echo "❌ Script oficial de deploy não encontrado."
              find . -maxdepth 3 -name "deploy_configr.sh" -print
              exit 1
            fi
            if [ "${{ inputs.remediate_process_architecture_runtime_drift }}" = "true" ] && \
               [ "$(git -C "$REPO" rev-parse HEAD)" != "${{ github.sha }}" ]; then
              echo "❌ SHA implantado diverge do run aprovado."
              exit 1
            fi
            if [ "${{ inputs.remediate_process_architecture_runtime_drift }}" = "true" ]; then
              chmod 0755 "$REPO/static" "$REPO/static/js"
              chmod 0644 "$REPO/static/js/process_architecture.js"
            fi

      - name: 🔎 Smoke pós-deploy (health + assets críticos)
        id: smoke
        shell: bash
        run: |
          set +e
          evidence="$(bash app32/scripts/deploy_smoke.sh)"
          status=$?
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: 🔎 Conferir bytes públicos do asset de processos
        if: ${{ inputs.remediate_process_architecture_runtime_drift }}
        shell: bash
        run: |
          set -euo pipefail
          base="${APP32_PUBLIC_BASE_URL:-https://app.gestaoversus.com.br}"
          expected="$(git hash-object static/js/process_architecture.js)"
          actual="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
            "${base%/}/static/js/process_architecture.js?run=${{ github.run_id }}" | git hash-object --stdin)"
          if [ "$actual" != "$expected" ]; then
            echo "Asset público diverge do SHA aprovado: expected=$expected actual=$actual"
            exit 1
          fi
          echo "✅ Asset de processos publicado com blob $actual"

      - name: 🧾 Ledger — concluir com sucesso
        if: env.DEPLOYMENT_ID != ''
        shell: bash
        env:
          EVIDENCE_JSON: ${{ steps.smoke.outputs.evidence }}
        run: bash app32/scripts/deploy_callback.sh succeeded

      - name: 🧾 Ledger — registrar falha
        if: failure() && env.DEPLOYMENT_ID != ''
        shell: bash
        env:
          EVIDENCE_JSON: ${{ steps.smoke.outputs.evidence }}
          FAILURE_REASON: workflow_failed
        run: bash app32/scripts/deploy_callback.sh failed || true

      - name: 🧾 Registrar resultado do deploy
        if: always()
        run: |
          {
            echo "## Resultado do deploy"
            echo "- Status do job: \`${{ job.status }}\`"
            echo "- Actor verificável: \`${{ github.actor }}\`"
            echo "- Triggering actor verificável: \`${{ github.triggering_actor }}\`"
            echo "- Correlation ID MCP: \`${DEPLOYMENT_ID:-manual-unlinked}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  diagnostic:
    name: Inventário somente leitura
    if: ${{ inputs.diagnostic_only }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Exigir operação humana e parâmetros sem mutação
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          RESTART: ${{ inputs.restart_mcp }}
          CHART_DRIFT: ${{ inputs.remediate_chartjs_runtime_drift }}
          PROCESS_DRIFT: ${{ inputs.remediate_process_architecture_runtime_drift }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          test "$ACTOR" = VrsEco
          test "$TRIGGERING_ACTOR" = VrsEco
          test "$REF" = refs/heads/main
          test "$RESTART" = false
          test "$CHART_DRIFT" = false
          test "$PROCESS_DRIFT" = false
          test -z "$DEPLOYMENT_ID"
      - name: Ler inventário Git sem atualizar índice
        uses: appleboy/ssh-action@v1.0.3
        env:
          INVENTORY_ROOT: ${{ secrets.PROJECT_PATH }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: INVENTORY_ROOT
          command_timeout: 5m
          script: |
            set -eu
            export GIT_OPTIONAL_LOCKS=0
            test -d "$INVENTORY_ROOT"
            cd -- "$INVENTORY_ROOT"
            test "$(git rev-parse --is-inside-work-tree)" = true
            printf 'HEAD='; git rev-parse HEAD
            printf 'TREE='; git rev-parse HEAD^{tree}
            printf 'UTC='; date -u +%FT%TZ
            python3 - <<'PY'
            import subprocess, json, hashlib
            def git(*args):
                return subprocess.check_output(['git', '--no-optional-locks', *args])
            # JSON escapes control characters; no file contents, patches or environment values.
            status = git('status', '--porcelain=v1', '-z', '--untracked-files=all')
            print(json.dumps({'status_entries': status.decode('utf-8', 'replace').split('\0')[:-1]}, ensure_ascii=True))
            for label, args in [('unstaged', ['diff', '--no-ext-diff', '--no-textconv', '--name-status', '-z']), ('staged', ['diff', '--cached', '--no-ext-diff', '--no-textconv', '--name-status', '-z'])]:
                raw = git(*args)
                print(json.dumps({label: raw.decode('utf-8', 'replace').split('\0')[:-1]}, ensure_ascii=True))
            print('inventory_complete=true')
            PY
