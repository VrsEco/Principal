name: 🚀 Deploy App32 to Production (Cloudez)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo do deploy"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - standard
          - full
      restart_mcp:
        description: "Reiniciar e validar o runtime MCP"
        required: true
        default: false
        type: boolean
      reconcile_drift:
        description: "Reconcilia drift remoto com backup antes do deploy (uso excepcional)"
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: 🧪 Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: 🔍 Check Syntax (Flake8)
        run: |
          # Checa apenas erros fatais e de sintaxe (E9, F63, F7, F82)
          # O .flake8 na raiz também exclui artefatos temporários locais/Codex.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy:
    name: 🚀 Deploy via SSH
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            set -e
            if [ "${{ inputs.reconcile_drift }}" = "true" ]; then
              BASE="/srv/appgestaoversuscombr.45a4cd4b.configr.cloud"
              WWW="$BASE/www"
              STAMP=$(date -u +%Y%m%dT%H%M%SZ)
              BACKUP_DIR="$BASE/backups"
              SNAPSHOT="$BACKUP_DIR/app32-controlled-drift-${STAMP}.tar.gz"
              STATUS_SNAPSHOT="$BACKUP_DIR/app32-controlled-drift-${STAMP}.status.txt"
              DIFF_SNAPSHOT="$BACKUP_DIR/app32-controlled-drift-${STAMP}.diff"
              EXPECTED_RELEASE="f9b5b502add5c2e8ed1340f0155eeef5ef0d91ad"

              echo "🛡️  Iniciando reconciliação controlada do checkout Configr..."
              test -d "$WWW/.git"
              mkdir -p "$BACKUP_DIR"
              git -C "$WWW" status --porcelain=v1 | tee "$STATUS_SNAPSHOT"
              git -C "$WWW" diff > "$DIFF_SNAPSHOT"
              tar -C "$WWW" -czf "$SNAPSHOT" static uploads app32
              tar -tzf "$SNAPSHOT" >/dev/null
              git -C "$WWW" fetch origin +refs/heads/main:refs/remotes/origin/main
              ACTUAL_RELEASE=$(git -C "$WWW" rev-parse origin/main)
              test "$ACTUAL_RELEASE" = "$EXPECTED_RELEASE"
              git -C "$WWW" reset --hard origin/main
              git -C "$WWW" clean -fd
              test -z "$(git -C "$WWW" status --porcelain=v1)"
              test -s "$SNAPSHOT"
              echo "✅ Drift preservado em $SNAPSHOT; release alvo: ${ACTUAL_RELEASE:0:8}"
            fi

            echo "📂 Acessando diretório do projeto..."
            cd ${{ secrets.PROJECT_PATH }}

            if [ -f "app32/scripts/deploy_configr.sh" ]; then
              echo "🚀 Executando deploy oficial via app32/scripts/deploy_configr.sh"
              DEPLOY_MODE="${{ inputs.mode }}" RESTART_MCP="${{ inputs.restart_mcp }}" bash app32/scripts/deploy_configr.sh
            elif [ -f "scripts/deploy_configr.sh" ]; then
              echo "🚀 Executando deploy oficial via scripts/deploy_configr.sh"
              DEPLOY_MODE="${{ inputs.mode }}" RESTART_MCP="${{ inputs.restart_mcp }}" bash scripts/deploy_configr.sh
            else
              echo "❌ Script oficial de deploy não encontrado."
              find . -maxdepth 3 -name "deploy_configr.sh" -print
              exit 1
            fi
