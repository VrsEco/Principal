name: 🚀 Deploy App32 to Production (Cloudez)

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: 🧪 Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: 🔍 Check Syntax (Flake8)
        run: |
          # Checa apenas erros fatais e de sintaxe (E9, F63, F7, F82)
          # O .flake8 na raiz irá excluir pastas como .venv automaticamente
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy:
    name: 🚀 Deploy via SSH
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            set -e
            # PROJECT_PATH deve ser o diretório /srv/.../www (raiz do git)
            echo "📂 Atualizando código na raiz do projeto..."
            cd ${{ secrets.PROJECT_PATH }}
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Instalando dependências do APP32..."
            PIP=/srv/appgestaoversuscombr.45a4cd4b.configr.cloud/.virtualenv/3.12/bin/pip
            $PIP install -r app32/requirements.txt --quiet

            echo "🗃️ Executando migrations do banco de dados (APP32)..."
            PYTHON=/srv/appgestaoversuscombr.45a4cd4b.configr.cloud/.virtualenv/3.12/bin/python
            set +e
            cd app32
            $PYTHON -c "
            import sys, os
            sys.path.insert(0, '.')
            from dotenv import load_dotenv
            load_dotenv('.env')
            os.environ.setdefault('FLASK_CONFIG', 'production')
            from flask_migrate import upgrade
            from app import create_app
            app = create_app('production')
            with app.app_context():
                upgrade()
            print('✅ Migrations OK')
            " 2>&1 || echo "⚠️ Migrations falharam ou não há migrações pendentes"
            cd ..
            set -e

            echo "🔄 Reiniciando o servidor (Passenger/uWSGI)..."
            # Toca arquivos de reinicialização na raiz e na pasta do app
            mkdir -p tmp
            touch tmp/restart.txt
            touch app32/tmp/restart.txt
            # Força recarregamento uWSGI se configurado
            touch etc/uwsgi/uwsgi.ini 2>/dev/null || true
            
            echo "✅ Deploy de APP32 concluído com sucesso!"
