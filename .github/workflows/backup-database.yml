# ============================================
# GestaoVersus - Automated Database Backup (Configr)
# ============================================
# Backup automático do banco PostgreSQL em produção no Configr.
# Horário: diário às 21:10 UTC (18:10 America/Bahia)
# ============================================

name: 💾 Database Backup (Configr)

on:
  schedule:
    - cron: '10 21 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: 💾 Backup PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🔐 Executing remote ssh commands to backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONFIGR_HOST }}
          username: ${{ secrets.CONFIGR_USER }}
          key: ${{ secrets.CONFIGR_SSH_PRIVATE_KEY }}
          port: ${{ secrets.CONFIGR_PORT }}
          command_timeout: 12m
          script_stop: true
          script: |
            set -euo pipefail

            BACKUP_DIR="/home/app2/backups"
            DATE=$(date +%Y%m%d_%H%M%S)
            TMP_FILE="$BACKUP_DIR/db_backup_${DATE}.sql"
            FINAL_FILE="${TMP_FILE}.gz"

            mkdir -p "$BACKUP_DIR"

            if ! command -v pg_dump >/dev/null 2>&1; then
              echo "❌ pg_dump não encontrado no servidor"
              exit 1
            fi

            rm -f "$TMP_FILE" "$FINAL_FILE"

            echo "📦 Gerando dump PostgreSQL..."
            PGCONNECT_TIMEOUT=10 pg_dump -h 127.0.0.1 -U mff2000 --no-owner --no-privileges bd_app_versus > "$TMP_FILE"

            if [ ! -s "$TMP_FILE" ]; then
              echo "❌ Dump gerado vazio"
              rm -f "$TMP_FILE"
              exit 1
            fi

            echo "🗜️ Compactando backup..."
            gzip -f "$TMP_FILE"

            if [ ! -s "$FINAL_FILE" ]; then
              echo "❌ Arquivo compactado não foi gerado corretamente"
              exit 1
            fi

            echo "🧹 Limpando backups antigos (30 dias)..."
            find "$BACKUP_DIR" -name "db_backup_*.sql.gz" -mtime +30 -delete

            echo "✅ Backup concluído: $(basename "$FINAL_FILE")"
            ls -lh "$FINAL_FILE"
