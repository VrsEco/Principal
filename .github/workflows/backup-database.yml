# ============================================
# GestaoVersus - Automated Database Backup (Configr)
# ============================================
# Backup automático do banco de dados no servidor Configr
# Schedule: Diário às 3:00 AM UTC (00:00 Brasília)
# ============================================

name: 💾 Database Backup (Configr)

on:
  schedule:
    # Diário às 18:10 (Horário de Brasília)
    # GitHub Actions usa UTC, então: 18:10 BRT = 21:10 UTC
    - cron: '10 21 * * *'
  workflow_dispatch:  # Permite execução manual

jobs:
  backup:
    name: 💾 Backup PostgreSQL
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔐 Executing remote ssh commands to backup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CONFIGR_HOST }}
          username: ${{ secrets.CONFIGR_USER }}
          key: ${{ secrets.CONFIGR_SSH_PRIVATE_KEY }}
          port: ${{ secrets.CONFIGR_PORT }}
          script: |
            # Configurações
            BACKUP_DIR="/home/app2/backups"
            DATE=$(date +%Y%m%d_%H%M%S)
            FILE="$BACKUP_DIR/db_backup_$DATE.sql"
            
            mkdir -p $BACKUP_DIR
            
            # Executar pg_dump
            # Assumindo que o PGPASSWORD pode ser necessário se não houver .pgpass
            # Mas como o usuário 'app2' geralmente tem acesso ao banco local:
            pg_dump -U mff2000 bd_app_versus > $FILE
            
            # Comprimir
            gzip $FILE
            
            # Limpeza: manter últimos 30 dias
            find $BACKUP_DIR -name "db_backup_*.sql.gz" -mtime +30 -delete
            
            echo "✅ Backup concluído: db_backup_$DATE.sql.gz"
            ls -lh $BACKUP_DIR/db_backup_$DATE.sql.gz
