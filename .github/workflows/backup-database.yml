# ============================================
# GestaoVersus - Automated Database Backup (Configr)
# ============================================
# Backup automático do banco PostgreSQL em produção no Configr.
# Horário: diário às 21:10 UTC (18:10 America/Bahia)
# ============================================

name: 💾 Database Backup (Configr)

on:
  schedule:
    - cron: '10 21 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: 💾 Backup PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONFIGR_HOST: ${{ secrets.CONFIGR_HOST }}
      CONFIGR_USER: ${{ secrets.CONFIGR_USER }}
      CONFIGR_PORT: ${{ secrets.CONFIGR_PORT }}
      CONFIGR_SSH_PRIVATE_KEY: ${{ secrets.CONFIGR_SSH_PRIVATE_KEY }}
      CONFIGR_KNOWN_HOSTS: ${{ secrets.CONFIGR_KNOWN_HOSTS }}

    steps:
      - name: 🔍 Validar secrets obrigatórios
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            CONFIGR_HOST
            CONFIGR_USER
            CONFIGR_PORT
            CONFIGR_SSH_PRIVATE_KEY
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "❌ Secret obrigatório ausente ou vazio: ${var_name}"
              exit 1
            fi
          done

      - name: 🔐 Preparar chave SSH com normalização segura
        shell: bash
        env:
          KEY_FILE: ${{ runner.temp }}/configr_backup_key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"

          python3 <<'PY'
          import base64
          import binascii
          import os
          import pathlib
          import re
          import sys
          import textwrap

          raw_key = os.environ.get("CONFIGR_SSH_PRIVATE_KEY", "").strip()
          key_file = os.environ["KEY_FILE"]

          if not raw_key:
              raise SystemExit("❌ Secret CONFIGR_SSH_PRIVATE_KEY está vazio.")

          normalized_candidates = []

          def add_candidate(value: str) -> None:
              candidate = value.strip().strip('"').strip("'").strip()
              if candidate and candidate not in normalized_candidates:
                  normalized_candidates.append(candidate)

          def normalize_line_endings(value: str) -> str:
              return (
                  value
                  .replace("\\r\\n", "\n")
                  .replace("\\n", "\n")
                  .replace("\\r", "\n")
                  .replace("\r\n", "\n")
                  .replace("\r", "\n")
              )

          def rebuild_single_line_pem(value: str) -> str | None:
              compact = "".join(value.strip().split())
              match = re.fullmatch(
                  r"(-{5}BEGIN ([A-Z0-9 ]+) KEY-{5})(.+)(-{5}END \2 KEY-{5})",
                  compact,
              )
              if not match:
                  return None
              header, _key_type, body, footer = match.groups()
              return "\n".join([header, *textwrap.wrap(body, 70), footer])

          raw_variants = [
              raw_key,
              normalize_line_endings(raw_key),
          ]

          for variant in list(raw_variants):
              rebuilt = rebuild_single_line_pem(variant)
              if rebuilt:
                  raw_variants.append(rebuilt)

          compact_key = "".join(raw_key.split())
          if compact_key and "BEGIN" not in raw_key:
              for decoder in (
                  lambda value: base64.b64decode(value, validate=True),
                  lambda value: base64.urlsafe_b64decode(value + "=" * (-len(value) % 4)),
              ):
                  try:
                      decoded_key = decoder(compact_key).decode("utf-8")
                  except (binascii.Error, UnicodeDecodeError, ValueError):
                      continue
                  raw_variants.append(decoded_key)
                  raw_variants.append(normalize_line_endings(decoded_key))

          for variant in raw_variants:
              add_candidate(variant)

          valid_markers = (
              "BEGIN OPENSSH PRIVATE KEY",
              "BEGIN RSA PRIVATE KEY",
              "BEGIN EC PRIVATE KEY",
              "BEGIN DSA PRIVATE KEY",
              "BEGIN PRIVATE KEY",
          )

          for candidate in normalized_candidates:
              normalized = normalize_line_endings(candidate).strip() + "\n"
              if (
                  any(marker in normalized for marker in valid_markers)
                  and "-----END " in normalized
              ):
                  pathlib.Path(key_file).write_text(normalized, encoding="utf-8")
                  print("✅ Chave SSH normalizada com sucesso.")
                  print(f"ℹ️ Linhas normalizadas da chave: {len(normalized.splitlines())}")
                  break
          else:
              raise SystemExit(
                  "❌ Não foi possível interpretar CONFIGR_SSH_PRIVATE_KEY. "
                  "Aceitos: chave multiline normal, texto com \\\\n literal ou base64 da chave privada."
              )
          PY

          chmod 600 "$KEY_FILE"

          if ! ssh-keygen -y -f "$KEY_FILE" > "$RUNNER_TEMP/configr_backup_key.pub" 2>"$RUNNER_TEMP/configr_backup_key_error.log"; then
            echo "❌ CONFIGR_SSH_PRIVATE_KEY foi reconhecida como chave privada, mas o OpenSSH não conseguiu carregá-la."
            echo "Detalhe técnico:"
            sed 's/^/  /' "$RUNNER_TEMP/configr_backup_key_error.log"
            echo ""
            echo "Causas prováveis:"
            echo "  1. secret contém uma chave privada incompleta/corrompida;"
            echo "  2. secret contém uma chave com passphrase, não adequada para automação sem agente;"
            echo "  3. secret foi salvo com escapes incomuns não recuperáveis."
            echo ""
            echo "Correção recomendada: gerar uma chave ED25519 exclusiva para o GitHub Actions, sem passphrase,"
            echo "cadastrar a chave pública no servidor e salvar a chave privada completa em CONFIGR_SSH_PRIVATE_KEY."
            exit 1
          fi

          echo "✅ Chave SSH validada localmente."

      - name: 🧾 Configurar known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts"
          touch "$KNOWN_HOSTS_FILE"
          chmod 644 "$KNOWN_HOSTS_FILE"

          if [ -n "${CONFIGR_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$CONFIGR_KNOWN_HOSTS" >> "$KNOWN_HOSTS_FILE"
            echo "✅ known_hosts carregado via secret CONFIGR_KNOWN_HOSTS."
          else
            echo "⚠️ Secret CONFIGR_KNOWN_HOSTS não informado; coletando host key via ssh-keyscan."
            ssh-keyscan -p "$CONFIGR_PORT" -H "$CONFIGR_HOST" >> "$KNOWN_HOSTS_FILE" 2>/dev/null
          fi

          if [ ! -s "$KNOWN_HOSTS_FILE" ]; then
            echo "❌ known_hosts não foi configurado corretamente."
            exit 1
          fi

      - name: 💾 Executar backup remoto via SSH nativo
        shell: bash
        env:
          KEY_FILE: ${{ runner.temp }}/configr_backup_key
        run: |
          set -euo pipefail

          ssh \
            -i "$KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -p "$CONFIGR_PORT" \
            "$CONFIGR_USER@$CONFIGR_HOST" \
            'bash -seuo pipefail' <<'REMOTE_SCRIPT'
            set -euo pipefail

            BACKUP_DIR="/home/app2/backups"
            DATE=$(date +%Y%m%d_%H%M%S)
            TMP_FILE="$BACKUP_DIR/db_backup_${DATE}.sql"
            TMP_GZ_FILE="${TMP_FILE}.gz.partial"
            FINAL_FILE="${TMP_FILE}.gz"
            umask 077

            cleanup() {
              rm -f "$TMP_FILE" "$TMP_GZ_FILE"
            }
            trap cleanup ERR INT TERM

            mkdir -p "$BACKUP_DIR"

            if ! command -v pg_dump >/dev/null 2>&1; then
              echo "❌ pg_dump não encontrado no servidor"
              exit 1
            fi

            rm -f "$TMP_FILE" "$FINAL_FILE"

            echo "📦 Gerando dump PostgreSQL..."
            PGCONNECT_TIMEOUT=10 pg_dump -h 127.0.0.1 -U mff2000 --no-owner --no-privileges bd_app_versus > "$TMP_FILE"

            if [ ! -s "$TMP_FILE" ]; then
              echo "❌ Dump gerado vazio"
              rm -f "$TMP_FILE"
              exit 1
            fi

            echo "🗜️ Compactando backup..."
            gzip -c "$TMP_FILE" > "$TMP_GZ_FILE"
            rm -f "$TMP_FILE"

            if [ ! -s "$TMP_GZ_FILE" ]; then
              echo "❌ Arquivo compactado não foi gerado corretamente"
              exit 1
            fi

            gzip -t "$TMP_GZ_FILE"
            mv -f "$TMP_GZ_FILE" "$FINAL_FILE"

            echo "🧹 Limpando backups antigos (30 dias)..."
            find "$BACKUP_DIR" -name "db_backup_*.sql.gz" -mtime +30 -delete

            echo "✅ Backup concluído: $(basename "$FINAL_FILE")"
            ls -lh "$FINAL_FILE"
            trap - ERR INT TERM
          REMOTE_SCRIPT
