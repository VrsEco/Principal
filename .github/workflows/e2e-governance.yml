name: QA E2E Governance

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app32/tests/e2e/**'
      - 'app32/tests/test_e2e_operations_center_*.py'
      - 'app32/api/routes/configs.py'
      - 'app32/services/e2e_operations_center_service.py'
      - '.github/workflows/e2e-governance.yml'
      - 'pytest.ini'
  workflow_dispatch:

jobs:
  e2e-governance:
    name: E2E governance gates
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      E2E_ENV_NAME: DEV_FULL
      E2E_BASE_URL: http://localhost.invalid
      E2E_USERNAME: ci-user
      E2E_PASSWORD: ci-password
      E2E_COMPANY_ID: '9'
      E2E_DESTRUCTIVE_ACTIONS_ALLOWED: 'true'
      E2E_REQUIRES_ISOLATED_TENANT: 'true'
      E2E_REQUIRE_EXPLICIT_COMPANY: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app32/requirements.txt

      - name: Install minimal governance dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-login flask-restful flask-cors flask-sqlalchemy flask-marshmallow marshmallow-sqlalchemy python-dotenv requests pydantic apscheduler pyyaml pytest

      - name: Inventory and suite catalog contracts
        run: |
          pytest app32/tests/e2e/test_inventory_contract.py app32/tests/e2e/test_suite_catalog.py -q

      - name: Governance drift gate
        run: |
          pytest app32/tests/e2e/test_drift_detector.py -q
          python app32/tests/e2e/scripts/run_drift_detection.py

      - name: History and failure governance gate
        run: |
          pytest app32/tests/e2e/test_execution_history.py app32/tests/e2e/test_failure_governance.py app32/tests/e2e/test_report_download_harness.py app32/tests/e2e/test_operational_report.py -q
          python app32/tests/e2e/scripts/build_execution_diff.py

      - name: Central E2E service and routes gate
        run: |
          pytest app32/tests/test_e2e_operations_center_service.py app32/tests/test_e2e_operations_center_routes.py app32/tests/e2e/test_supervised_execution_service.py -q
