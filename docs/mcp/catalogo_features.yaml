version: "2026-06-13.1"
owner: "sapiens-mcp"
description: "Catálogo resumido e seguro para bootstrap do MCP Sapiens."
bootstrap:
  auto_load: true
  detail_strategy: "on_demand"
  filters_required:
    - company_id
    - surface
    - role
  deny_by_default: true
policies:
  principles:
    - "least_privilege"
    - "progressive_disclosure"
    - "tenant_isolation"
    - "mcp_first"
  never_expose_in_catalog:
    - "detalhes de implementação"
    - "payloads administrativos sensíveis"
    - "estrutura de banco de dados"
    - "regras internas profundas de autorização"
domains:
  - id: "routine"
    nome: "Gestão da Rotina"
    descricao: "Operações do dia a dia, tarefas e acompanhamento operacional."
  - id: "processes"
    nome: "Processos"
    descricao: "Consultas e acompanhamento de processos operacionais estruturados."
  - id: "finance"
    nome: "Financeiro"
    descricao: "Consultas executivas e operacionais financeiras conforme surface."
  - id: "governance"
    nome: "Governança e Gestão Comercial"
    descricao: "Contratos, clientes, catálogo comercial, surfaces MCP, instruction registry e governança operacional."
  - id: "real_estate_auctions"
    nome: "Leilões Imobiliários"
    descricao: "Pipeline multi-tenant de oportunidades imobiliárias, fontes, diligência e ficha financeira."
  - id: "strategy"
    nome: "Estratégia"
    descricao: "Identidade organizacional, alinhamento estratégico e leitura executiva governada."
  - id: "projects"
    nome: "Projetos"
    descricao: "Projetos e atividades tenant-safe usados como base operacional por agentes."
  - id: "meetings"
    nome: "Reuniões"
    descricao: "Agendas, registros e acompanhamentos de reuniões dentro do tenant."
  - id: "workload"
    nome: "Capacidade e Workload"
    descricao: "Leituras analíticas de capacidade, carga e alocação de equipe."
  - id: "identity_self_service"
    nome: "Identidade do Usuário"
    descricao: "Empresas, perfil e contexto de sessão do usuário autenticado."
  - id: "operations"
    nome: "Operações Técnicas"
    descricao: "Escalonamentos, integrações e suporte operacional técnico."
features:
  - id: "rotina_tarefas"
    nome: "Tarefas da Rotina"
    dominio: "routine"
    objetivo: "Consultar e orientar a execução de tarefas operacionais."
    quando_usar:
      - "listar tarefas do dia"
      - "acompanhar status da rotina"
      - "orientar execução operacional"
    entradas:
      obrigatorias:
        - "company_id"
      opcionais:
        - "data_referencia"
        - "responsavel_id"
        - "status"
    saidas:
      - "lista_de_tarefas"
      - "status"
      - "resumo_operacional"
    surfaces:
      - "user"
      - "admin"
    detalhe_disponivel: true
    guia_ref: "features/rotina_tarefas.md"

  - id: "processos_acompanhamento"
    nome: "Acompanhamento de Processos"
    dominio: "processes"
    objetivo: "Consultar andamento, responsáveis e próximos passos de processos."
    quando_usar:
      - "ver status de processo"
      - "orientar acompanhamento"
      - "identificar próximos passos"
    entradas:
      obrigatorias:
        - "company_id"
      opcionais:
        - "processo_id"
        - "periodo"
        - "responsavel_id"
    saidas:
      - "status_do_processo"
      - "proximos_passos"
      - "responsaveis"
    surfaces:
      - "user"
      - "admin"
      - "ops"
    detalhe_disponivel: true
    guia_ref: "features/processos_acompanhamento.md"

  - id: "processos_copiloto_fluxo"
    nome: "Copiloto de Fluxo BPMN"
    dominio: "processes"
    objetivo: "Analisar fluxo BPMN, apontar gaps de lanes/POPs/gateways e sugerir automações ou conexões APP32/internet com revisão humana."
    quando_usar:
      - "revisar modelagem de fluxo"
      - "identificar atividades automatizáveis"
      - "sugerir conexões com APP32, MCP, APIs ou apps externos"
    entradas:
      obrigatorias:
        - "company_id"
        - "processo_id"
      opcionais:
        - "bpmn_element_id"
        - "objetivo"
        - "diagram_status"
    saidas:
      - "analise_do_fluxo"
      - "candidatos_de_automacao"
      - "candidatos_de_integracao"
      - "alertas_de_revisao_humana"
    surfaces:
      - "user"
      - "admin"
    detalhe_disponivel: true
    guia_ref: "features/processos_copiloto_fluxo.md"

  - id: "processos_pop_copilot"
    nome: "POP Copilot com Vídeo Curto"
    dominio: "processes"
    objetivo: "Apoiar a construção de POPs por passo com vídeo curto, print derivado do frame e contexto MCP multimídia."
    quando_usar:
      - "documentar um passo com vídeo curto"
      - "capturar print a partir do vídeo"
      - "orientar revisão humana do passo POP"
    entradas:
      obrigatorias:
        - "company_id"
      opcionais:
        - "step_id"
        - "video_mp4_ou_webm"
        - "descricao_do_passo"
        - "narracao_do_operador"
    saidas:
      - "contexto_multimidia_do_passo"
      - "duracao_do_video"
      - "acoes_recomendadas"
      - "print_do_frame_atual"
      - "rascunho_inicial_da_descricao"
    surfaces:
      - "user"
      - "admin"
    detalhe_disponivel: true
    guia_ref: "features/processos_pop_copilot.md"

  - id: "financeiro_fluxo_caixa"
    nome: "Fluxo de Caixa"
    dominio: "finance"
    objetivo: "Consultar visão de fluxo de caixa conforme perfil e surface autorizada."
    quando_usar:
      - "consultar posição financeira"
      - "analisar entradas e saídas"
      - "obter resumo executivo"
    entradas:
      obrigatorias:
        - "company_id"
      opcionais:
        - "periodo"
        - "conta"
        - "centro_resultado"
    saidas:
      - "resumo_financeiro"
      - "entradas"
      - "saidas"
      - "saldo"
    surfaces:
      - "admin"
      - "analytics"
    detalhe_disponivel: true
    guia_ref: "features/financeiro_fluxo_caixa.md"

  - id: "gestao_comercial_contratos"
    nome: "Gestão Comercial — Contratos, Clientes e Catálogo"
    dominio: "governance"
    objetivo: "Operar leitura e manutenção governada de carteiras de clientes, PJs emissoras, catálogo comercial, contratos e itens."
    quando_usar:
      - "consultar dashboard ou lista de contratos comerciais"
      - "manter carteira de clientes, clientes, emissores ou produtos/serviços"
      - "criar, atualizar, suspender, encerrar ou excluir contrato comercial com trilha auditável"
    entradas:
      obrigatorias:
        - "company_id"
      opcionais:
        - "user_id"
        - "contract_id"
        - "filters"
        - "payload"
    saidas:
      - "dashboard_comercial"
      - "contratos"
      - "clientes"
      - "catalogo_comercial"
      - "workspace_do_contrato"
    surfaces:
      - "user"
      - "admin"
    detalhe_disponivel: false

  - id: "gestao_comercial_faturamento_fiscal"
    nome: "Gestão Comercial — Faturamento, Títulos e NFS-e"
    dominio: "finance"
    objetivo: "Apoiar revisão, geração, cancelamento, integração financeira e esteira fiscal de faturamentos comerciais."
    quando_usar:
      - "listar contratos aptos para faturamento"
      - "montar revisão de faturamento antes da confirmação"
      - "gerar faturamentos, títulos financeiros ou planilha de integração fiscal"
      - "controlar status, lote e dados fiscais de NFS-e"
    entradas:
      obrigatorias:
        - "company_id"
      opcionais:
        - "user_id"
        - "billing_id"
        - "billing_ids"
        - "contract_ids"
        - "review_payloads"
        - "filters"
    saidas:
      - "fila_de_faturamento"
      - "revisao_de_faturamento"
      - "faturamentos_gerados"
      - "workspace_fiscal"
      - "planilha_base64"
    surfaces:
      - "user"
      - "admin"
      - "analytics"
    detalhe_disponivel: false

  - id: "financeiro_operacional"
    nome: "Financeiro Operacional e Orçamentário"
    dominio: "finance"
    objetivo: "Executar e consultar cadastros, títulos, lançamentos, transferências bancárias, extrato, borderôs, orçamento, conciliação, classificação, fechamento e relatórios."
    quando_usar:
      - "consultar ou criar títulos financeiros"
      - "operar lançamentos, liquidações, borderôs e conciliações"
      - "criar transferência bancária administrativa entre contas do tenant"
      - "simular ou aplicar reparo controlado do Extrato Bancário"
      - "gerar relatórios e dashboard executivo financeiro"
      - "trabalhar com orçamento matricial ou classificação automática"
    entradas:
      obrigatorias:
        - "company_id"
      opcionais:
        - "user_id"
        - "filters"
        - "payload"
        - "periodo"
    saidas:
      - "registros_financeiros"
      - "titulos"
      - "transferencias_bancarias"
      - "reparos_de_extrato"
      - "relatorios"
      - "matriz_orcamentaria"
      - "resumo_executivo"
    surfaces:
      - "user"
      - "admin"
      - "analytics"
    detalhe_disponivel: false

  - id: "leiloes_imobiliarios_pipeline"
    nome: "Leilões Imobiliários"
    dominio: "real_estate_auctions"
    objetivo: "Consultar e operar pipeline de oportunidades imobiliárias, fontes, eventos, ficha financeira, diligência e anexos."
    quando_usar:
      - "listar oportunidades de leilão"
      - "consultar detalhe de imóvel"
      - "registrar fonte, evento, diligência ou ficha financeira"
      - "arquivar oportunidade imobiliária"
    entradas:
      obrigatorias:
        - "company_id"
      opcionais:
        - "property_id"
        - "source_id"
        - "event_id"
        - "payload"
        - "filters"
    saidas:
      - "workspace_de_leiloes"
      - "imoveis"
      - "fontes"
      - "eventos"
      - "ficha_financeira"
      - "due_diligence"
    surfaces:
      - "user"
      - "admin"
      - "analytics"
    detalhe_disponivel: false

  - id: "jornada_operacional_work_journey"
    nome: "Jornada Operacional"
    dominio: "routine"
    objetivo: "Operar blocos, regras, agenda, tarefas, calendário, capacidade, ausências e transferências da rotina."
    quando_usar:
      - "organizar a jornada diária ou semanal"
      - "consultar tarefas alocadas, atrasadas ou não alocadas"
      - "mover agenda, gerar agenda ou avaliar capacidade"
      - "solicitar ou aprovar ausências e transferências"
    entradas:
      obrigatorias:
        - "company_id"
      opcionais:
        - "user_id"
        - "employee_id"
        - "block_id"
        - "task_id"
        - "filters"
        - "payload"
    saidas:
      - "quadro_da_jornada"
      - "agenda"
      - "tarefas"
      - "capacidade"
      - "ausencias"
      - "transferencias"
    surfaces:
      - "user"
      - "admin"
      - "analytics"
      - "ops"
    detalhe_disponivel: false

  - id: "governanca_mcp_catalogo"
    nome: "Governança MCP e Instruction Registry"
    dominio: "governance"
    objetivo: "Descobrir capabilities, contracts, playbooks, surfaces, readiness, release, usage, instruction bundles e contexto de sessão MCP."
    quando_usar:
      - "entender quais tools estão publicadas"
      - "verificar permission matrix, profile contracts ou playbooks de surface"
      - "fazer bootstrap de sessão, selecionar empresa ou resolver instruction bundle"
      - "avaliar readiness, release checklist, usage dashboard ou ativação Sapiens"
    entradas:
      obrigatorias:
        - "surface"
      opcionais:
        - "company_id"
        - "user_id"
        - "domain"
        - "feature_id"
        - "profile"
    saidas:
      - "manifesto_de_capabilities"
      - "catalogo_de_features"
      - "contratos_mcp"
      - "playbooks"
      - "contexto_da_sessao"
    surfaces:
      - "user"
      - "admin"
      - "analytics"
      - "ops"
    detalhe_disponivel: false
