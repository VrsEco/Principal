version: "2026-05-20.3"
owner: "sapiens-mcp"
description: "Catálogo resumido e seguro para bootstrap do MCP Sapiens."
bootstrap:
  auto_load: true
  detail_strategy: "on_demand"
  filters_required:
    - company_id
    - surface
    - role
  deny_by_default: true
policies:
  principles:
    - "least_privilege"
    - "progressive_disclosure"
    - "tenant_isolation"
    - "mcp_first"
  never_expose_in_catalog:
    - "detalhes de implementação"
    - "payloads administrativos sensíveis"
    - "estrutura de banco de dados"
    - "regras internas profundas de autorização"
domains:
  - id: "routine"
    nome: "Gestão da Rotina"
    descricao: "Operações do dia a dia, tarefas e acompanhamento operacional."
  - id: "processes"
    nome: "Processos"
    descricao: "Consultas e acompanhamento de processos operacionais estruturados."
  - id: "finance"
    nome: "Financeiro"
    descricao: "Consultas executivas e operacionais financeiras conforme surface."
features:
  - id: "rotina_tarefas"
    nome: "Tarefas da Rotina"
    dominio: "routine"
    objetivo: "Consultar e orientar a execução de tarefas operacionais."
    quando_usar:
      - "listar tarefas do dia"
      - "acompanhar status da rotina"
      - "orientar execução operacional"
    entradas:
      obrigatorias:
        - "company_id"
      opcionais:
        - "data_referencia"
        - "responsavel_id"
        - "status"
    saidas:
      - "lista_de_tarefas"
      - "status"
      - "resumo_operacional"
    surfaces:
      - "user"
      - "admin"
    detalhe_disponivel: true
    guia_ref: "features/rotina_tarefas.md"

  - id: "processos_acompanhamento"
    nome: "Acompanhamento de Processos"
    dominio: "processes"
    objetivo: "Consultar andamento, responsáveis e próximos passos de processos."
    quando_usar:
      - "ver status de processo"
      - "orientar acompanhamento"
      - "identificar próximos passos"
    entradas:
      obrigatorias:
        - "company_id"
      opcionais:
        - "processo_id"
        - "periodo"
        - "responsavel_id"
    saidas:
      - "status_do_processo"
      - "proximos_passos"
      - "responsaveis"
    surfaces:
      - "user"
      - "admin"
      - "ops"
    detalhe_disponivel: true
    guia_ref: "features/processos_acompanhamento.md"

  - id: "processos_copiloto_fluxo"
    nome: "Copiloto de Fluxo BPMN"
    dominio: "processes"
    objetivo: "Analisar fluxo BPMN, apontar gaps de lanes/POPs/gateways e sugerir automações ou conexões APP32/internet com revisão humana."
    quando_usar:
      - "revisar modelagem de fluxo"
      - "identificar atividades automatizáveis"
      - "sugerir conexões com APP32, MCP, APIs ou apps externos"
    entradas:
      obrigatorias:
        - "company_id"
        - "processo_id"
      opcionais:
        - "bpmn_element_id"
        - "objetivo"
        - "diagram_status"
    saidas:
      - "analise_do_fluxo"
      - "candidatos_de_automacao"
      - "candidatos_de_integracao"
      - "alertas_de_revisao_humana"
    surfaces:
      - "user"
      - "admin"
    detalhe_disponivel: true
    guia_ref: "features/processos_copiloto_fluxo.md"

  - id: "processos_pop_copilot"
    nome: "POP Copilot com Vídeo Curto"
    dominio: "processes"
    objetivo: "Apoiar a construção de POPs por passo com vídeo curto, print derivado do frame e contexto MCP multimídia."
    quando_usar:
      - "documentar um passo com vídeo curto"
      - "capturar print a partir do vídeo"
      - "orientar revisão humana do passo POP"
    entradas:
      obrigatorias:
        - "company_id"
      opcionais:
        - "step_id"
        - "video_mp4_ou_webm"
        - "descricao_do_passo"
        - "narracao_do_operador"
    saidas:
      - "contexto_multimidia_do_passo"
      - "duracao_do_video"
      - "acoes_recomendadas"
      - "print_do_frame_atual"
      - "rascunho_inicial_da_descricao"
    surfaces:
      - "user"
      - "admin"
    detalhe_disponivel: true
    guia_ref: "features/processos_pop_copilot.md"

  - id: "financeiro_fluxo_caixa"
    nome: "Fluxo de Caixa"
    dominio: "finance"
    objetivo: "Consultar visão de fluxo de caixa conforme perfil e surface autorizada."
    quando_usar:
      - "consultar posição financeira"
      - "analisar entradas e saídas"
      - "obter resumo executivo"
    entradas:
      obrigatorias:
        - "company_id"
      opcionais:
        - "periodo"
        - "conta"
        - "centro_resultado"
    saidas:
      - "resumo_financeiro"
      - "entradas"
      - "saidas"
      - "saldo"
    surfaces:
      - "admin"
      - "analytics"
    detalhe_disponivel: true
    guia_ref: "features/financeiro_fluxo_caixa.md"
