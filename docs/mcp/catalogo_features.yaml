      - "saidas"
      - "saldo"
    surfaces:
      - "admin"
      - "analytics"
    detalhe_disponivel: true
    guia_ref: "features/financeiro_fluxo_caixa.md"

  - id: "financeiro_conciliacao_bancaria"
